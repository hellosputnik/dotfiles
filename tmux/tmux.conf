# Use Vim key bindings
setw -g mode-keys vi

# Fix Vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Allow programs in the pane to detect focus events (vital for Vim autoread).
set -g focus-events on

# Start window and pane numbering at 1, (0 is too hard to reach).
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber window numbers on closing a pane (e.g., 1, 3 -> 1, 2).
set -g renumber-windows on

# Improve colors. A "screen-*" value makes tmux emulate screen, which has no
# italics capability, so italic text is rendered as reverse video instead.
# Fall back to screen-256color where the tmux entry is absent from terminfo,
# since naming a terminal tmux cannot resolve stops it from starting.
if-shell 'infocmp tmux-256color > /dev/null 2>&1' {
    set -g default-terminal "tmux-256color"
} {
    set -g default-terminal "screen-256color"
}

# Increase scrollback buffer size
set-option -g history-limit 1000000

# Use Vim key bindings for pane navigation
unbind-key j; bind-key j select-pane -D
unbind-key k; bind-key k select-pane -U
unbind-key h; bind-key h select-pane -L
unbind-key l; bind-key l select-pane -R

# Use Vim key bindings for selection and copy operations
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X begin-selection

# Use the system clipboard when copying inside tmux.
if-shell -b 'command -v pbcopy > /dev/null' {
    bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'pbcopy'
    bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'pbcopy'
}

if-shell -b 'command -v xclip > /dev/null' {
    bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
    bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
}

if-shell -b 'command -v clip.exe > /dev/null' {
    bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'clip.exe'
    bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'clip.exe'
}

# Use intuitive split-window keys
bind | split-window -h
bind - split-window -v

# Enable 24-bit TrueColor support for modern terminal emulators
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Repeatable home-row window navigation (H/L) after the prefix.
bind-key -r H select-window -t :-
bind-key -r L select-window -t :+

# Disable accidental client suspension.
unbind-key C-z

# Style the status bar to be dark gray and quiet.
set -g status-style bg='#666666',fg='#aaaaaa'
set -g status-left ''
set -g status-right ''

# Style the pane borders to be quiet.
set -g pane-active-border-style fg='#888888'
set -g pane-border-style fg='#444444'

# Bind r to reload the tmux configuration.
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Enable curly and colored underlines in modern terminal emulators.
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setqy=\E[58:2::%p1%{65536}%/%d:%p1%{256}%/%{255}%&%d:%p1%{255}%&%d%m'

# Enable extended keys (like Shift+Enter) in modern terminals
set -g extended-keys always
set -as terminal-features 'xterm*:extkeys'

# Load local tmux overrides.
if-shell "[ -f ~/.tmux.conf.local ]" 'source-file ~/.tmux.conf.local'

# Tmux Plugin Manager (TPM) and Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'jaclu/tmux-menus'

# Configure tmux-resurrect and tmux-continuum
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Customize tmux-menus trigger to prefix + Ctrl+p
set -g @menus_trigger 'C-p'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
